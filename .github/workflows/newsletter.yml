name: newsletter

on:
  schedule:
    # Varios intentos al día: el primero que logre enviar marca la edición y el resto se omite.
    # (Los cron de GitHub Actions se retrasan con frecuencia; estos slots compensan el retraso y los fallos.)
    - cron: '30 8 * * *'
    - cron: '30 10 * * *'
    - cron: '30 12 * * *'
    - cron: '30 14 * * *'
    - cron: '30 16 * * *'
    - cron: '30 18 * * *'
    - cron: '30 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  newsletter:
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Pillow
        run: python -m pip install --quiet Pillow

      - name: Generar páginas
        run: python newsletter/generar.py

      - name: Enviar el correo (no en push)
        if: github.event_name != 'push'
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
        run: python newsletter/generar.py --enviar

      - name: Publicar páginas en la rama main (docs/)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "newsletter: $(date +%F)" || true
          for intento in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            echo "[-] Push falló (intento $intento); reintentando en 20s..."
            sleep 20
          done
          echo "[!] No se pudo publicar las páginas (transitorio); el correo ya fue enviado."